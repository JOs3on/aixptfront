<!doctype html>
<html lang="fr" class="dark">
  <head>
    <!-- Core / Standard SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIXPT - L'automatisation IA au Québec</title>
    <meta name="description" content="AIXPT aide les entreprises du Québec à récupérer leurs leads perdus, automatiser leur réception téléphonique et offrir un support 24/7 intégré à leurs systèmes." />
    <link rel="icon" type="image/png" href="/logo2.png" />

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (kickers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AIXPT - L'automatisation IA au Québec" />
    <meta property="og:description" content="Récupérez vos leads perdus, automatisez votre réception téléphonique et offrez un support 24/7." />
    <meta property="og:url" content="https://aixpt.ca/" />
    <meta property="og:image" content="https://aixpt.ca/logo2.png" />
    
    <!-- Structured Data for LLMs and Google (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "AIXPT",
      "image": "https://aixpt.ca/logo2.png",
      "description": "AIXPT aide les entreprises du Québec à récupérer leurs leads perdus, offre un support client 24/7 et automatise la réception téléphonique.",
      "url": "https://aixpt.ca",
      "telephone": "+1-418-800-5085",
      "email": "support@aixpt.ca",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Québec",
        "addressRegion": "QC",
        "addressCountry": "CA"
      },
      "areaServed": "Québec, Canada"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
